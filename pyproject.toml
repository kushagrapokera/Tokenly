[project]
name = "tokenly"
version = "0.1.0"
description = "Local-first token usage tracker for AI coding assistants"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["skills", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["skills", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
