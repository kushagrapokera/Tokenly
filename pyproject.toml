[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenly"
version = "1.0.0"
description = "Local-first token usage tracker for AI coding assistants"
requires-python = ">=3.10"

[project.scripts]
myusage = "cli.myusage:main"

[tool.setuptools.packages.find]
include = ["cli*", "collectors*", "aggregation*", "config*", "database*", "errors*", "logging_setup*", "normalization*", "routes*", "schemas*", "sync*"]
exclude = ["tests*", "skills*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["skills", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["skills", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
